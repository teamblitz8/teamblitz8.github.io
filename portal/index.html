<!DOCTYPE html>

<html lang="en-GB">
    <head>
        <title>Team Blitz - Dashboard</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="./imgs/blitzLogo_TransparentSquare.svg">
        <link rel="stylesheet" href="./css/global.css">
        <link rel="stylesheet" href="./css/home.css">
        <script src="https://kit.fontawesome.com/5de12ac90d.js"></script>
        <script src="./js/global.js" defer></script>
        <script src="./js/dashboard.js" defer></script>
        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
    </head>

    <body>
        <div id="nav">
            <div id="profile">
                <img>
                <p></p>
                <button onclick="unroll()"><i class="fa-solid fah fa-chevron-down"></i></button>
            </div>
            <div id="profile-menu">
                <a id="placeholder-button"></a>
                <a href="./account.html" id="first-button"><i class="fa-solid fa-user"></i> My account</a>
                <a href="./designs.html"><i class="fa-solid fa-pencil"></i> My designs</a>
                <button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
            </div>
        </div>
        <div class="popup-shroud">
            <div id="popup-container">
                <div class="popup">
                    <button id="X" onclick="showPopup()"><i class="fa-solid fa-x"></i></button>
                    <h3 id="popup-title">Upload a new design</h3>
                    <p id="logged-username"></p>
                    <div class="upload-file">
                        <button type="button" onclick="document.getElementById('car-model').click()"><i class="fa-solid fa-arrow-up-from-bracket"></i>Upload file (.f3d)</button>
                        <input type="file" id="car-model" name="car-model" style="display: none;">
                    </div>
                    <div class="info">
                        <h2>Tell us more about your design</h2>
                        <div id="metadata-error" class="error" style="display:none;"></div>
                        <form id="car-info" action="" novalidate>
                            <div class="section">
                                <div>
                                    <div>
                                        <label for="name">Name of prototype</label>
                                        <input type="text" id="name" name="name" placeholder="Deodorant 64">
                                        <p class="label"></p>
                                    </div>
                                    <div>
                                        <label for="date">Date created</label>
                                        <input type="date" id="date" name="date">
                                        <p class="label"></p>
                                    </div>
                                </div>
                            </div>
                            <div class="section">
                                <h3 class="section-title">Quantitative CFD data</h3>
                                <div>
                                    <div>
                                        <label for="frontal-area">Frontal Area</label>
                                        <input type="number" id="frontal-area" name="frontal-area" placeholder="2000.000">
                                        <p class="label">mm²</p>
                                    </div>
                                    <div>
                                        <label for="drag-coefficient">Drag Coefficient</label>
                                        <input type="number" id="drag-coefficient" name="drag-coefficient" placeholder="0.67676767">
                                        <p class="label">(dimensionless scalar)</p>
                                    </div>
                                </div>
                                <p id="drag-calc"></p>
                            </div>
                            <div class="section" id="scrutineer">
                                <h3 class="section-title">Who scrutineered the car?</h3>
                                <div>
                                    <div>
                                        <input type="radio" id="yash" name="scrutineerer" value="yash" required>
                                        <label for="yash">Yash</label>
                                    </div>
                                    <div>
                                        <input type="radio" id="chen" name="scrutineerer" value="chen" required>
                                        <label for="chen">Chen</label>
                                    </div>
                                    <div>
                                        <input type="radio" id="pranit" name="scrutineerer" value="pranit" required>
                                        <label for="pranit">Pranit</label>
                                    </div>
                                    <div>
                                        <input type="radio" id="josh" name="scrutineerer" value="josh" required>
                                        <label for="pranit">Josh</label>
                                    </div>
                                </div>
                                <p id="funny">Cooked bro, that guy is not trustworthy at all</p>
                            </div>
                            <div class="section" id="changes">
                                <h3 class="section-title">Changes</h3>
                                <div>
                                    <div>
                                        <label for="derived-car">Which car was this design derived or built upon from?</label>
                                        <select id="derived-car" name="derived-car" required>
                                            <option value="1">Latest iteration: Beta by Chen (Iteration 1)</option>
                                            <option>This wasn't built based on any existing car</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label for="changelog">What changed from it, or what are its key features?</label>
                                        <textarea id="changelog" name="changelog" placeholder="Enter all changes made from previous design; please separate each one by placing [BRK;] between each one" required></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="section">
                                <h3 class="section-title">Qualitative CFD data</h3>
                                <div>
                                    <div class="upload-file">
                                        <button type="button" onclick="document.getElementById('iso').click()"><i class="fa-solid fa-arrow-up-from-bracket"></i>Upload iso surfaces screenshot (.png)</button>
                                        <input type="file" id="iso" name="iso" style="display: none;">
                                    </div>
                                    <div class="upload-file">
                                        <button type="button" onclick="document.getElementById('planes').click()"><i class="fa-solid fa-arrow-up-from-bracket"></i>Upload planes screenshot (.png)</button>
                                        <input type="file" id="planes" name="planes" style="display: none;">
                                    </div>
                                </div>
                            </div>
                            <div class="section" id="add-info">
                                <h3 class="section-title">Additional information</h3>
                                <div>
                                    <div>
                                        <label for="add-notes">Any additional details?</label>
                                        <textarea id="add-notes" name="add-notes" placeholder="Enter any additional details"></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="section">
                                <div>
                                    <div id="submission"><input type="submit" id="submit" name="submit"></div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div id="main-error" class="error"></div>
        <h1 id="greeting"></h1>
        <div id="upload"><button onclick="showPopup()"><i class="fa-solid fa-arrow-up-from-bracket"></i> Upload a new design</button></div>
        <h2 id="title"></h2>
        <div id="development-container"></div>
        <div id="loadMore" style="display:none;"><button onclick="loadMore()"><i class="fa-solid fa-chevron-down"></i> Load more</button></div>
    </body>
</html>
