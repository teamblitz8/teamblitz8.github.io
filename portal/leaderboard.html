<!DOCTYPE html>

<html lang="en-GB">
    <head>
        <title>Team Blitz - Leaderboard</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="./imgs/blitzLogo_TransparentSquare.svg">
        <link rel="stylesheet" href="./css/global.css">
        <link rel="stylesheet" href="./css/leaderboard.css">
        <script src="https://kit.fontawesome.com/5de12ac90d.js"></script>
        <script type="text/javascript" src="dist/purify.min.js"></script>
        <script src="./js/global.js" defer></script>
        <script src="./js/leaderboard.js" defer></script>
    </head>

    <body>
        <div id="nav">
            <div id="profile">
                <img>
                <p></p>
                <button onclick="unroll()"><i class="fa-solid fah fa-chevron-down"></i></button>
            </div>
            <div id="profile-menu">
                <a id="placeholder-button"></a>
                <a href="./" id="first-button"><i class="fa-solid fa-igloo"></i> Dashboard</a>
                <a href="./account.html" id="first-button"><i class="fa-solid fa-user"></i> My account</a>
                <button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
            </div>
        </div>

        <h1 id="page-title">Leaderboard</h1>
        <div id="error-box"><div id="main-error" class="error"></div></div>
        <div id="options">
            <div class="scroll-container">
                <div class="swapper active" id="type">
                    <div class="active-indicator"></div>
                    <button onclick="swap('type', 'people', this)" class="enabled" id="bpeople"><i class="fa-solid fa-user"></i> People</button>
                    <button onclick="swap('type', 'cars', this)" id="bcars"><i class="fa-solid fa-car-side"></i> Car body</button>
                    <button onclick="swap('type', 'wheels', this)" id="bwheels"><i class="fa-solid fa-ring"></i> Wheels</button>
                </div>
            </div>
            <div class="scroll-container">
                <div class="swapper active" id="people">
                    <div class="active-indicator"></div>
                    <button onclick="swap('people', 'all', this)" class="enabled" id="all">All</button>
                </div>
            </div>
            <div class="scroll-container">
                <div class="swapper" id="cars">
                    <div class="active-indicator"></div>
                    <button onclick="swap('cars', 'drag', this)" class="enabled" id="drag">Drag</button>
                    <button onclick="swap('cars', 'frontal-area', this)" id="frontal-area">Frontal area</button>
                    <button onclick="swap('cars', 'cd', this)" id="cd">Drag coefficient</button>
                    <button onclick="swap('cars', 'car-date', this)" id="car-date">Latest date</button>
                </div>
            </div>
            <div class="scroll-container">
                <div class="swapper" id="wheels">
                    <div class="active-indicator"></div>
                    <button onclick="swap('wheels', 'moi', this)" id="moi" class="enabled">Moment of inertia</button>
                    <button onclick="swap('wheels', 'fos', this)" id="fos">Factor of safety</button>
                    <button onclick="swap('wheels', 'wheel-date', this)" id="wheel-date">Latest date</button>
                </div>
            </div>
        </div>
        <div id="leaderboard-container">
            <div class="wheels moi leaderboard empty">
                <div class="error" id="empty-error">There appears to be no data. Try changing some of the filters.</div>
            </div>
            <div class="wheels fos leaderboard empty">
                <div class="error" id="empty-error">There appears to be no data. Try changing some of the filters.</div>
            </div>
            <div class="wheels wheel-date leaderboard empty">
                <div class="error" id="empty-error">There appears to be no data. Try changing some of the filters.</div>
            </div>
        </div>
    </body>
</html>
